# AWS 배포용 설정

# 서버 포트 (5000 포트 사용)
server.port=${PORT:5000}

# 탄력적 IP 설정
server.address=43.200.102.14

# 데이터베이스 설정 (통일된 MySQL 서버)
spring.datasource.url=jdbc:mysql://43.200.102.14:3306/readmark?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=readmarkuser
spring.datasource.password=!@12QWqw

# JPA 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
# MySQL 특화 설정
spring.sql.init.mode=never

# 파일 업로드 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 로깅 설정 (AWS CloudWatch용)
logging.level.com.example.ReadMark=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web.socket=INFO
logging.level.com.example.ReadMark.handler.ESP32WebSocketHandler=INFO
logging.level.com.example.ReadMark.config.WebSocketConfig=INFO

# Google Vision API 설정 (환경변수로 설정)
# GOOGLE_APPLICATION_CREDENTIALS 환경변수 사용

# CORS 설정 (ESP32 접근 허용)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*

# AWS 특화 설정
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
