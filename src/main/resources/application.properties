# ?? ??
server.port=5000
# ?? IP?? ?? ????? ???
server.address=0.0.0.0

# MySQL 데이터베이스 설정 (탄력적 IP 사용)
spring.datasource.url=${DBURL}

spring.datasource.username=${USER}
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA 설정 (Hibernate 스키마 관리 완전 비활성화)
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# H2 ?? ?? ?? (? ?? ?? ? ?)
spring.h2.console.enabled=false

# SQL ??? (???)
spring.sql.init.mode=never
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.continue-on-error=false
# spring.jpa.defer-datasource-initialization=true

# ?? ???
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.file-size-threshold=2KB

# Tomcat 연결 타임아웃 설정 (파일 업로드 시 타임아웃 방지)
server.tomcat.connection-timeout=120000
server.tomcat.keep-alive-timeout=120000
server.tomcat.max-connections=10000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# 정적 리소스 설정 (프로필 이미지)
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.mvc.static-path-pattern=/uploads/**,/images/**

# ?? ??
logging.level.com.example.ReadMark=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.example.ReadMark.handler.ESP32WebSocketHandler=DEBUG
logging.level.com.example.ReadMark.config.WebSocketConfig=DEBUG
logging.level.com.example.ReadMark.config.HttpRequestLoggingInterceptor=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.apache.tomcat=INFO
logging.level.org.apache.catalina=INFO

# Google Vision API 설정
google.vision.enabled=true

